repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^artifacts/
      - id: end-of-file-fixer
        exclude: ^artifacts/
      - id: check-yaml
      - id: check-added-large-files

  # Ruff, Black and mypy run from the project environment (``pip install -e ".[dev]"``) so the
  # hooks use exactly the same tool versions and first-party import detection as the CI commands
  # documented in the README (``python -m ruff check .``, ``python -m black --check .`` and
  # ``python -m mypy src``).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: python -m black --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy src
        language: system
        types: [python]
        pass_filenames: false
